[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "double-pendulum"
version = "0.1.0"
description = "Standalone base-actuated double-pendulum swing-up and balancing with SAC and mJLab."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "imageio-ffmpeg",
  "mediapy>=1.2.6",
  "mujoco==3.5.0",
  "mujoco-warp==3.5.0",
  "numpy>=1.26",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.5.4",
  "prettytable",
  "pyyaml>=6.0",
  "rsl-rl-lib==5.0.1",
  "scipy>=1.13",
  "tensorboard>=2.20.0",
  "torch>=2.7.0",
  "tqdm",
  "trimesh>=4.8.3",
  "tyro>=1.0.1",
  "viser>=1.0.24",
  "wandb>=0.19",
  "warp-lang>=1.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
